<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StudioBoard — DevOps Architecture &amp; Live Teaching Whiteboard</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='3' width='28' height='26' rx='6' fill='%232563eb'/%3E%3Cpath d='M9 12h14M9 17h10M9 22h6' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='21' r='3' fill='%23facc15'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="wb-app" class="wb-app">
      <!-- Top Bar -->
      <header id="wb-topbar" class="wb-topbar" role="banner"></header>

      <!-- Floating Active Teaching Mode & Spotlight Banner -->
      <div id="wb-mode-banner" class="wb-mode-banner wb-hidden" aria-live="polite"></div>

      <!-- Main Workspace -->
      <div class="wb-workspace">
        <!-- Left Tool Dock -->
        <aside id="wb-toolbar" class="wb-toolbar" aria-label="Drawing Tools"></aside>

        <!-- Collapsible Left Side Panels -->
        <aside id="wb-library-panel" class="wb-side-panel wb-left-panel wb-hidden" aria-label="Stencil and Template Library"></aside>
        <aside id="wb-layers-panel" class="wb-side-panel wb-left-panel wb-hidden" aria-label="Layers Panel"></aside>
        <aside id="wb-classroom-panel" class="wb-side-panel wb-left-panel wb-hidden" aria-label="Live Classroom and Student Questions"></aside>

        <!-- Interactive Canvas Viewport -->
        <main id="wb-canvas-wrap" class="wb-canvas-wrap" tabindex="-1">
          <canvas id="wb-canvas" aria-label="Interactive Whiteboard Canvas"></canvas>
          <canvas id="wb-minimap" class="wb-minimap" width="180" height="120" aria-label="Minimap Navigation"></canvas>
          <div id="wb-notebook" class="wb-notebook wb-hidden" role="region" aria-label="Notebook — vertically stacked lesson pages"></div>
          <button type="button" id="wb-canvas-settings-chip" class="wb-canvas-settings-chip wb-hidden" title="Open Canvas Settings (background, grid, snapping)" aria-label="Open Canvas Settings">⚙ Canvas</button>

          <!-- Empty board guidance — shows when the active page has no content -->
          <div id="wb-empty-state" class="wb-empty-state wb-hidden" role="region" aria-label="Get started on an empty board">
            <div class="wb-empty-state-card">
              <h2>Start with a blank board</h2>
              <p>Nothing on the canvas yet. Choose how to begin:</p>
              <div class="wb-empty-actions">
                <button type="button" class="wb-btn wb-sm" id="btn-empty-blank">Blank board</button>
                <button type="button" class="wb-btn wb-sm wb-primary" id="btn-empty-template">Use a template</button>
                <button type="button" class="wb-btn wb-sm" id="btn-empty-workflows">Explore workflows</button>
              </div>
            </div>
          </div>
        </main>

        <!-- Right Properties Inspector -->
        <aside id="wb-props-panel" class="wb-side-panel wb-right-panel" aria-label="Element Properties Inspector"></aside>
      </div>

      <!-- Bottom Bar (Pages + Zoom) -->
      <footer class="wb-footer">
        <div id="wb-pages-bar" class="wb-pages-bar" role="navigation" aria-label="Document Pages"></div>
        <div id="wb-bottombar" class="wb-bottombar"></div>
      </footer>

      <!-- Floating Teaching Widgets -->
      <div id="wb-timer-widget" class="wb-timer-widget wb-hidden" role="region" aria-label="Classroom Timer"></div>
      <div id="wb-present-bar" class="wb-present-bar wb-hidden" role="region" aria-label="Presentation Controls"></div>
      <div id="wb-anim-bar" class="wb-anim-bar wb-hidden" role="region" aria-label="Teaching Animation Controls"></div>

      <!-- Command Palette Overlay -->
      <div id="wb-palette-backdrop" class="wb-modal-backdrop wb-hidden" role="dialog" aria-modal="true" aria-label="Command Palette">
        <div id="wb-palette-box" class="wb-palette-box"></div>
      </div>

      <!-- Generic Modal Overlay -->
      <div id="wb-modal-backdrop" class="wb-modal-backdrop wb-hidden" role="dialog" aria-modal="true">
        <div id="wb-modal-box" class="wb-modal-box"></div>
      </div>

      <!-- Toast Notifications -->
      <div id="wb-toast-container" class="wb-toast-container" aria-live="polite"></div>

      <!-- Hidden File Inputs -->
      <input type="file" id="wb-file-open-json" accept=".json,.whiteboard.json" class="wb-hidden" />
      <input type="file" id="wb-file-image" accept="image/*" class="wb-hidden" />
      <input type="file" id="wb-file-import-lib" accept=".json,.library.json" class="wb-hidden" />
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
